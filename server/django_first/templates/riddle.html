{% extends 'base.html' %}
{% load static %}

{% block header_nav %}
<nav>
    <div class="nav-single-buttons">
        <button data-url="{% url 'index' %}"
            onclick="window.location.href = this.dataset.url;"
            class="nav-single-btn primary">На главную</button>
        <button data-url="{% url 'answer' %}"
            onclick="window.location.href = this.dataset.url;"
            class="nav-single-btn secondary">К ответу</button>
    </div>
</nav>
{% endblock header_nav %}

{% block content %}
<h2>Отгадай загадку и реши вопрос</h2>
<div class="copy-grid-item">
    <div class="copy-item-title">Загадка</div>
    <div class="copy-item-content" onclick="copyTextOnClick(this)">Зимой и летом
        одним цветом</div>
</div>

{% endblock %}
