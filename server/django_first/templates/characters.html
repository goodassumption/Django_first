{% extends 'base.html' %}
{% load static %}

{% block content %}
<h1>Персонажи</h1>
<p>На этой странице расположен список персонажей, которые мне нравится :)</p>

<div class="media-grid" id="mediaGrid">
    {% for media in media_list %}
    <div class="media-item">
        <div class="media-item">
            <div class="media-preview">
                <img src="{{ media.url }}"
                    alt="{{ media.name }}"
                    onclick="window.open('{{ media.url }}', '_blank'); event.stopPropagation();"
                    style="cursor: zoom-in"
                    title="Клик для открытия изображения">
                <span class="media-badge photo">Фото</span>
            </div>
            <div class="media-content" style="margin: auto;">
                <h3 class="media-title">{{ media.name }}</h3>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
